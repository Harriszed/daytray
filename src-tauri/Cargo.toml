[package]
name = "daytray"
version = "1.0.0"
description = "Minimal desktop taskbar flyout for daily to-dos, recurring schedules, and quick notes"
authors = ["Daytray Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "daytray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
